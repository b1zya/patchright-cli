name: Stealth online (manual)

# Opens the public detector pages through `selftest --online` and uploads screenshots.
# Never gates anything: datacenter IPs get challenged regardless of the browser posture.

on:
  workflow_dispatch:

jobs:
  online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: selftest --online
        run: xvfb-run -a node bin/patchright-cli.js selftest --online || true
      - uses: actions/upload-artifact@v7
        with:
          name: selftest-online-screenshots
          path: .patchright-cli/
          include-hidden-files: true
          if-no-files-found: warn
