name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable: the upstream workflows run the same matrix on a roll branch before opening
  # its pull request (a PR created by the workflow token does not trigger CI on its own).
  workflow_call:
    inputs:
      ref:
        description: 'git ref to test (default: the caller ref)'
        required: false
        type: string
        default: ''

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Google Chrome is preinstalled on all three runner images; no browser download needed.
        os: [ubuntu-latest, windows-latest, macos-15]
        node: [20, 22]
        exclude:
          - os: macos-15
            node: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck, help sync and upstream drift
        run: npm run check
      - name: Environment report
        run: node bin/patchright-cli.js doctor || echo "doctor reported issues (see above)"
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Stealth tests (headed Chrome)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:stealth
      - name: Stealth tests (headed Chrome)
        if: runner.os != 'Linux'
        run: npm run test:stealth
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
