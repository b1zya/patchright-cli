name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The upstream workflows dispatch this on the branch they pushed (.github/actions/ci-on-branch):
  # a PR opened with the workflow token starts no CI, and the `main` ruleset requires these job
  # names on the PR head. Keep its required checks in step with the matrix below.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Google Chrome is preinstalled on all three runner images; no browser download needed.
        os: [ubuntu-latest, windows-latest, macos-15]
        # The supported LTS lines: the floor in package.json engines and the active LTS.
        node: [22, 24]
        exclude:
          - os: macos-15
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck, help sync and upstream drift
        run: npm run check
      - name: Environment report
        run: node bin/patchright-cli.js doctor || echo "doctor reported issues (see above)"
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Stealth tests (headed Chrome)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:stealth
      - name: Stealth tests (headed Chrome)
        if: runner.os != 'Linux'
        run: npm run test:stealth
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.os }}-node${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
